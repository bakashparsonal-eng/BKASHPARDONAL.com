<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nagad Payment | ROMAN TOPUP BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase V10 Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAV4PTJ2VU7uAfDU6hCVjXzBhcYMY-kyXc",
            authDomain: "roman-topup-bd.firebaseapp.com",
            databaseURL: "https://roman-topup-bd-default-rtdb.firebaseio.com",
            projectId: "roman-topup-bd",
            storageBucket: "roman-topup-bd.firebasestorage.app",
            messagingSenderId: "1022888841536",
            appId: "1:1022888841536:web:abcd061243a3331264eaa5",
            measurementId: "G-309D1K2G3X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const amountSpan = document.getElementById('display-amount');
        const numberSpan = document.getElementById('display-number');
        const bannerList = document.getElementById('banner-list');
        const trxInput = document.getElementById('trx-input');
        const submitBtn = document.getElementById('submit-btn');
        const orderIdSpan = document.getElementById('order-id');

        // URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount') || "0";
        const method = "nagad"; // Fixed for this page

        // UI Setup
        amountSpan.innerText = amount;
        orderIdSpan.innerText = orderId ? orderId : 'N/A';

        // Load Banners from Firestore
        const loadBanners = async () => {
            try {
                const docRef = doc(db, "settings", "banners");
                const docSnap = await getDoc(docRef);
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    let bannerHTML = '';
                    for(let i=1; i<=6; i++) {
                        const imgUrl = data[`img${i}`];
                        if(imgUrl) bannerHTML += `<img src="${imgUrl}" class="banner-img" alt="Step ${i}" onerror="this.style.display='none'">`;
                    }
                    bannerList.innerHTML = bannerHTML || '<p class="text-xs text-gray-400">ব্যানার পাওয়া যায়নি</p>';
                }
            } catch(e) { console.error("Banner Error:", e); }
        };

        // Load Nagad Payment Number from Firestore `paymentGateways`
        const loadPaymentNumber = async () => {
            try {
                const docRef = doc(db, "paymentGateways", method);
                const docSnap = await getDoc(docRef);
                if(docSnap.exists() && docSnap.data().number) {
                    numberSpan.innerText = docSnap.data().number;
                } else {
                    numberSpan.innerText = '017XXXXXXXX'; // Fallback
                }
            } catch(e) { 
                numberSpan.innerText = '017XXXXXXXX';
                console.error("Number Error:", e);
            }
        };

        // Copy Number
        window.copyNumber = () => {
            const num = numberSpan.innerText;
            navigator.clipboard.writeText(num).then(() => {
                const toast = document.getElementById('toastMsg');
                toast.innerText = "📋 নম্বর কপি হয়েছে!";
                toast.className = "toast-custom show";
                setTimeout(() => toast.className = "toast-custom", 2500);
            });
        };

        // Submit Payment
        window.sendPayment = async () => {
            const trx = trxInput.value.trim().toUpperCase();
            if(!trx) return showToast("❌ TrxID লিখুন!", true);
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="loading-spinner"></span> যাচাই হচ্ছে...`;

            try {
                // 1. Check for duplicate TrxID
                const q = query(collection(db, "orders"), where("transactionId", "==", trx));
                const snapshot = await getDocs(q);
                if(!snapshot.empty) {
                    showToast("⚠️ এই TrxID আগেই ব্যবহার হয়েছে!", true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Confirm & Submit";
                    return;
                }

                // 2. If orderId exists, update the order
                if(orderId) {
                    const orderRef = doc(db, "orders", orderId);
                    await updateDoc(orderRef, {
                        transactionId: trx,
                        paymentMethod: method,
                        paymentStatus: "verified",
                        status: "processing",
                        updatedAt: serverTimestamp()
                    });
                    showToast("✅ পেমেন্ট সফল! অর্ডার প্রসেসিং শুরু হয়েছে!");
                } else {
                    // If no orderId (e.g. Add Money), create a new payment log
                    await addDoc(collection(db, "payments"), {
                        trxid: trx,
                        amount: amount,
                        method: method,
                        status: "Pending",
                        time: serverTimestamp()
                    });
                    showToast("✅ পেমেন্ট রেকর্ড করা হয়েছে!");
                }

                trxInput.value = "";
                
                // Close window after 2 seconds
                setTimeout(() => window.close(), 2000);

            } catch (e) {
                console.error(e);
                showToast("❌ ত্রুটি হয়েছে! আবার চেষ্টা করুন।", true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Confirm & Submit";
            }
        };

        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.style.background = isError ? "#ef4444" : "#1e293b";
            toast.className = "toast-custom show";
            setTimeout(() => { toast.className = "toast-custom"; }, 2500);
        };

        // Init
        loadBanners();
        loadPaymentNumber();
        trxInput.addEventListener("input", function() { this.value = this.value.toUpperCase(); });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        /* Nagad Theme Colors */
        .nagad-gradient { background: linear-gradient(135deg, #F5A623 0%, #d48a1a 100%); }
        .nagad-border { border-color: #F5A623; }
        .nagad-text { color: #F5A623; }
        
        .toast-custom {
            visibility: hidden; min-width: 280px; background: #1e293b; color: white;
            text-align: center; border-radius: 2rem; padding: 12px 20px; position: fixed;
            z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%) scale(0.9);
            opacity: 0; transition: all 0.25s ease; font-weight: 600; backdrop-filter: blur(8px);
            background: rgba(30,41,59,0.95); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2);
        }
        .toast-custom.show { visibility: visible; opacity: 1; transform: translateX(-50%) scale(1); }
        .loading-spinner {
            display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .banner-img { width: 150px; height: 90px; object-fit: cover; border-radius: 12px; flex-shrink: 0; border: 1px solid #eee; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="nagad-gradient p-6 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-white/20 backdrop-blur-sm p-2 rounded-xl">
                        <!-- Nagad Icon (Simplified) -->
                        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z"/>
                        </svg>
                    </div>
                    <span class="text-white font-black text-xl tracking-tight">Nagad Merchant</span>
                </div>
                <div class="text-white text-right">
                    <p class="text-[10px] uppercase font-bold opacity-80 tracking-[0.15em]">Payable Amount</p>
                    <h2 class="text-3xl font-black tracking-tight">৳ <span id="display-amount" class="tabular-nums">0</span></h2>
                </div>
            </div>

            <div class="py-6">
                <!-- Order ID -->
                <div class="px-6 mb-3">
                    <div class="bg-gray-100 rounded-xl p-2 text-center text-xs">
                        <span class="text-gray-500">অর্ডার আইডি:</span>
                        <span id="order-id" class="font-mono font-bold text-gray-700">-</span>
                    </div>
                </div>

                <!-- Banners -->
                <div class="px-6 mb-6">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-widest block mb-3 ml-1">
                        কিভাবে পেমেন্ট করবেন? (ধাপগুলো দেখুন)
                    </label>
                    <div id="banner-list" class="flex gap-3 overflow-x-auto scrollbar-hide pb-2">
                        <div class="banner-img skeleton-shimmer"></div>
                        <div class="banner-img skeleton-shimmer"></div>
                        <div class="banner-img skeleton-shimmer"></div>
                    </div>
                </div>

                <div class="px-6">
                    <!-- Info Alert -->
                    <div class="bg-orange-50 border-l-[5px] nagad-border p-4 rounded-2xl mb-7">
                        <div class="flex items-start gap-3">
                            <span class="nagad-text text-xl">📌</span>
                            <p class="text-xs font-semibold text-gray-700 leading-relaxed">
                                <span class="font-black nagad-text">Send Money</span> করুন নিচের নম্বরে। টাকা পাঠানোর পর <span class="font-bold">TrxID</span> টি দিন।
                            </p>
                        </div>
                    </div>

                    <!-- Personal Number -->
                    <div class="mb-8">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest block mb-2 ml-1">পেমেন্ট নম্বর</label>
                        <div onclick="copyNumber()" class="flex items-center justify-between bg-white p-5 rounded-2xl border-2 border-dashed border-orange-200 hover:border-[#F5A623] cursor-pointer transition-all active:scale-95">
                            <span id="display-number" class="text-3xl font-black tracking-tighter text-gray-800">লোড হচ্ছে...</span>
                            <div class="nagad-gradient text-white p-2.5 rounded-xl">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- TrxID Input -->
                    <div class="space-y-6">
                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase ml-2 block mb-2 tracking-widest">Transaction ID (TrxID)</label>
                            <input type="text" id="trx-input" placeholder="8N7A9X2K5L" class="w-full p-5 bg-gray-50 border-2 border-gray-200 focus:border-[#F5A623] focus:outline-none text-center font-mono font-bold text-xl uppercase rounded-2xl transition-all">
                        </div>
                        
                        <button id="submit-btn" onclick="sendPayment()" class="w-full nagad-gradient text-white font-bold py-5 rounded-2xl shadow-lg uppercase text-sm tracking-widest active:scale-95 transition-all flex items-center justify-center gap-2">
                            Confirm & Submit
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 p-4 text-center border-t">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">🔒 Secure Payment • ROMAN TOPUP BD</p>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast-custom">✨ কপি হয়েছে!</div>

</body>
</html>
